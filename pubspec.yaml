name: dlchat
description: "DLChat - Персональный ИИ ассистент"
publish_to: 'none'
version: 1.2.4+72
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.2"

workspace:
  - packages/image_saver
  - packages/logger
  - packages/rest_client

dependencies:
  appmetrica_plugin: ^4.1.0
  bloc: ^9.2.1
  cached_network_image: ^4.0.0
  carapacik_dio_logger: ^1.0.0
  clock: ^1.1.3
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  cross_file: ^0.3.5+5
  cupertino_icons: ^1.0.9
  decimal: ^3.2.6
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  email_validator: ^3.0.0
  fading_edge_scrollview: ^4.1.1
  ffmpeg_kit_flutter_new: ^4.6.2
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_multi_formatter: ^2.13.11
  flutter_rustore_review: ^10.5.1
  flutter_secure_storage: ^11.0.0
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  http: ^1.6.0
  image_saver:
    path: packages/image_saver
  in_app_review: ^2.0.12
  internet_connection_checker_plus: ^3.1.1
  intl: ^0.20.3
  loading_animation_widget: ^1.3.0
  logger:
    path: packages/logger
  meta: ^1.19.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pinput: ^6.0.2
  provider: ^6.1.5+1
  record: ^7.1.1
  rest_client:
    path: packages/rest_client
  retrofit: ^4.10.0
  rxdart: ^0.28.0
  sentry_flutter: ^9.28.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^3.0.0
  stack_trace: ^1.12.2
  tutorial_coach_mark: ^1.3.4
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  video_player: ^2.14.0
  web: ^1.1.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.16.1
  carapacik_lints: ^3.13.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  freezed: ^4.0.1

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/app/
    - assets/fonts/
    - assets/image/
    - assets/svg/
    - assets/video/

  fonts:
    - family: SFNSExpanded
      fonts:
        - asset: assets/fonts/sf-ns-expanded-semibold.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600

flutter_gen:
  output: lib/src/core/constant/generated
  line_length: 120
  integrations:
    flutter_svg: true

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: ru
  arb_dir: lib/src/core/constant/localization/translations
  output_dir: lib/src/core/constant/localization/generated

arb_generator:
  input_filepath: "assets/l10n.csv"
  output_directory: lib/src/core/constant/localization/translations
  filename_prepend: "intl_"
  csv_settings:
    delimiter: ","
    base_index: 1
