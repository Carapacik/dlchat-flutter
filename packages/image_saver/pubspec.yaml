name: image_saver
description: Plugin for save images
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.2"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  web: ^1.1.1

flutter:
  plugin:
    platforms:
      android:
        package: ru.xakermonkey.image_saver
        pluginClass: ImageSaverPlugin
      ios:
        pluginClass: ImageSaverPlugin
      macos:
        pluginClass: ImageSaverPlugin
      web:
        pluginClass: ImageSaverWeb
        fileName: image_saver_web.dart
